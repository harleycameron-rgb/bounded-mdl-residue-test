name: MDL Blueprint CI

on:
  push:
  pull_request:

jobs:
  run-mdl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run MDL multi-agent test
        run: |
          python tests/run_mdl.py

      - name: Print drift + residue
        run: |
          python - << 'EOF'
import sys
try:
    from mdl.runtime import generate_report, AgentNetwork

    network = AgentNetwork([
        ("alpha", "model-a"),
        ("beta", "model-b"),
        ("gamma", "model-c"),
    ])

    network.run("Track drift propagation without recursion.", rounds=2)
    report = generate_report(network, round_index=1)

    print("DRIFT:", report["drift"])
    print("RESIDUE:", report["residue"])
except ImportError as e:
    print(f"Import Error: {e}", file=sys.stderr)
    print("Ensure mdl package is in requirements.txt", file=sys.stderr)
    sys.exit(1)
except Exception as e:
    print(f"Error: {e}", file=sys.stderr)
    import traceback
    traceback.print_exc()
    sys.exit(1)
EOF
